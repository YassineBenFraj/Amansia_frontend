<div class="payment-backdrop" *ngIf="open"><section class="payment-modal" role="dialog" aria-modal="true" aria-label="Paiement sécurisé"><button class="close" type="button" (click)="close()" [disabled]="loading" aria-label="Fermer le paiement">×</button><h2>Paiement sécurisé</h2><div id="amansia-payment-element"></div><p *ngIf="error" class="error" role="alert">{{ error }}</p><button class="button primary" type="button" (click)="pay()" [disabled]="loading" [attr.aria-busy]="loading">{{ loading ? 'Traitement…' : 'Payer maintenant' }}</button></section></div>
