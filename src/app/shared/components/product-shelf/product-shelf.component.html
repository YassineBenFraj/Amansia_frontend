<section
  class="product-shelf container"
  *ngIf="loading || items.length"
  [attr.aria-label]="title"
>
  <header class="shelf-heading">
    <div>
      <p class="eyebrow">{{ eyebrow }}</p>
      <h2>{{ title }}</h2>
    </div>
    <a routerLink="/produits">Voir le catalogue →</a>
  </header>
  <div
    *ngIf="loading"
    class="product-grid shelf-grid"
    role="status"
    aria-label="Chargement des produits"
  >
    <div class="shelf-skeleton" *ngFor="let placeholder of [1, 2, 3, 4]">
      <span></span><span></span><span></span>
    </div>
  </div>
  <div *ngIf="!loading" class="product-grid shelf-grid">
    <article
      *ngFor="let item of items; trackBy: trackById"
      class="product-card"
    >
      <button
        type="button"
        class="shelf-favorite"
        (click)="toggleFavorite(item)"
        [disabled]="favoris.isPending(item.produit.id)"
        [attr.aria-label]="
          favoris.isFavorite(item.produit.id)
            ? 'Retirer des favoris'
            : 'Ajouter aux favoris'
        "
        [attr.aria-pressed]="favoris.isFavorite(item.produit.id)"
      >
        {{ favoris.isFavorite(item.produit.id) ? "♥" : "♡" }}
      </button>
      <a class="product-image" [routerLink]="['/produits', item.produit.id]">
        <img
          appImageFallback
          [src]="imageUrl(item)"
          [alt]="item.produit.nom"
          loading="lazy"
        />
        <span *ngIf="item.produit.disponible === false" class="shelf-stock"
          >Rupture de stock</span
        >
        <span *ngIf="item.produit.prixPromotion != null" class="badge">Promotion</span>
      </a>
      <div class="product-info">
        <p>{{ item.produit.categorieNom }}</p>
        <h3>
          <a [routerLink]="['/produits', item.produit.id]">{{
            item.produit.nom
          }}</a>
        </h3>
        <div class="price">
          <strong>{{
            item.produit.prixPromotion ?? item.produit.prix | tnd
          }}</strong
          ><del *ngIf="item.produit.prixPromotion != null">{{
            item.produit.prix | tnd
          }}</del>
        </div>
        <button type="button" class="shelf-compare" [class.selected]="comparator.has(item.produit.id)" [attr.aria-pressed]="comparator.has(item.produit.id)" (click)="comparator.toggle(item.produit)">{{ comparator.has(item.produit.id) ? '✓ À comparer' : 'Comparer' }}</button>
      </div>
    </article>
  </div>
</section>
